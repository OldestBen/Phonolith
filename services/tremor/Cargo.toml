[package]
name = "tremor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
async-nats   = "0.35"
notify       = "6"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow       = "1"
chrono       = { version = "0.4",  features = ["serde"] }
futures      = "0.3"
