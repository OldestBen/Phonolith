[package]
name = "bitforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
async-nats   = "0.35"
blake3       = "1"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow       = "1"
rusqlite     = { version = "0.31", features = ["bundled"] }
chrono       = { version = "0.4",  features = ["serde"] }
futures      = "0.3"
bytes        = "1"
