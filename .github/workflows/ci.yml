name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: Node (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python sidecars (lint · compile · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately light: the analyst's heavy deps (librosa, numpy, mutagen)
      # are imported lazily inside functions, so linting, byte-compiling, and the
      # pure-logic unit tests need none of them. Keeps CI fast.
      #
      # ruff is version-pinned so its rule set matches what we lint against
      # locally; combined with the explicit `select` in ruff.toml, `ruff check`
      # is fully deterministic across environments.
      - name: Install lint/test tools
        run: pip install ruff==0.15.8 pytest

      - name: Ruff lint
        run: ruff check analyst lucid

      - name: Byte-compile all modules
        run: python -m py_compile analyst/*.py lucid/*.py

      - name: Unit tests
        run: pytest analyst/tests -q
