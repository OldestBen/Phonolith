# Phonolith reverse proxy.
#
# Media bytes (/stream/*) and the realtime transport socket (/ws/*) go
# straight to Lucid — they must never pass through the Next.js app process.
# Everything else goes to the Next.js app.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 0;

  location /stream/ {
    proxy_pass http://lucid:8001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    # Range requests need to reach Lucid untouched for seek-without-rebuffer.
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
  }

  location /ws/ {
    proxy_pass http://lucid:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
