services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://phonolith:phonolith@db:5432/phonolith
      - REDIS_URL=redis://redis:6379
      - ANALYST_URL=http://analyst:8000
      - LUCID_URL=http://lucid:8001
      - CREDENTIAL_KEY=${CREDENTIAL_KEY:-}
      - DISCOGS_USER_TOKEN=${DISCOGS_USER_TOKEN:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - MUSICBRAINZ_APP_NAME=${MUSICBRAINZ_APP_NAME:-Phonolith}
      - MUSICBRAINZ_APP_VERSION=${MUSICBRAINZ_APP_VERSION:-1.0}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - POLYPHONY_BACKUP_DIR=/data/polyphony-backups
      - SLSKD_URL=http://slskd:5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - polyphony_backups:/data/polyphony-backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  analyst:
    build:
      context: ./analyst
      dockerfile: Dockerfile
    ports:
      - "${ANALYST_PORT:-8000}:8000"
    environment:
      - APP_URL=http://app:3000
      - REDIS_URL=redis://redis:6379
      - LIBRARY_PATH=/music
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      # Read-write: write_tags (main.py) saves edited ID3/Vorbis/MP4 tags back to
      # library files, and the nested soulcatcher_downloads mount below needs to
      # create its mountpoint under /music — Docker can't do that under a
      # read-only bind mount (mkdir would hit EROFS).
      - ${LIBRARY_PATH:-./music}:/music
      # Soulcatcher downloads land here via the slskd service below. Mounted into
      # the analyst's /music tree (not just slskd's) so a library rescan picks up
      # completed downloads — see src/app/api/soulcatcher/downloads/[id]/ingest.
      - soulcatcher_downloads:/music/soulcatcher-downloads
      - waveforms:/waveforms
    depends_on:
      - redis
    restart: unless-stopped

  # Lucid — audio transport daemon (browser streaming + optional ALSA exclusive output)
  # Browser playback (the RAAT-style baseline) needs no audio hardware on the host.
  # ALSA exclusive output for enthusiast DACs requires the docker-compose.alsa.yml
  # overlay (adds /dev/snd passthrough) — see README.
  lucid:
    build:
      context: ./lucid
      dockerfile: Dockerfile
    ports:
      - "${LUCID_PORT:-8001}:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_URL=http://app:3000
    volumes:
      - ${LIBRARY_PATH:-./music}:/music:ro
    depends_on:
      - redis
    restart: unless-stopped

  # Caddy — single public entry point. Routes media bytes and the realtime
  # transport WebSocket directly to Lucid (never through the Next.js app),
  # everything else to the Next.js app. Set SITE_ADDRESS to a real domain
  # to get automatic Let's Encrypt HTTPS; left unset, it serves plain HTTP
  # on HTTP_PORT for LAN/no-domain use.
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - lucid
    restart: unless-stopped

  # Tailscale — optional sidecar that joins this instance to your private tailnet,
  # giving zero-config remote access without forwarding any ports. Reachable at the
  # container's Tailscale IP once authenticated; combine with `tailscale serve`/`funnel`
  # (run via `docker compose exec tailscale tailscale serve ...`) to publish Caddy over
  # the tailnet or the public internet. Harmless if TAILSCALE_AUTHKEY is left unset —
  # the container will simply sit idle without joining a tailnet.
  tailscale:
    image: tailscale/tailscale:latest
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - tailscale_state:/var/lib/tailscale
    restart: unless-stopped

  # Cloudflare Tunnel — optional sidecar that exposes Caddy through Cloudflare's edge,
  # useful for sharing this instance without revealing your home IP. Requires a tunnel
  # token created in the Cloudflare Zero Trust dashboard (Networks → Tunnels). Without
  # CLOUDFLARE_TUNNEL_TOKEN set, this container will fail to start cleanly — that's
  # expected and harmless; leave it stopped (or never run `docker compose up cloudflared`)
  # if you don't use Cloudflare Tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped

  # slskd — Soulseek client daemon, headless. Provides the REST API that
  # src/lib/soulcatcher.ts talks to (search, browse, enqueue downloads).
  # Only reachable on the internal Docker network — the Next.js app proxies
  # to it via SLSKD_URL, so no host port is published here.
  slskd:
    image: slskd/slskd:latest
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASSWORD:-}
      - SLSKD_HTTP_PORT=5030
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      # In-progress transfers are written here, under the /app config volume —
      # a different volume than soulcatcher_downloads below, so the analyst's
      # watcher (which only sees soulcatcher_downloads) can never observe a
      # partially-written file. slskd renames into SLSKD_DOWNLOADS_DIR only
      # once a transfer completes. Set explicitly rather than relying on
      # slskd's default (APP_DIR/incomplete) so this guarantee survives a
      # slskd version bump changing that default.
      - SLSKD_INCOMPLETE_DIR=/app/incomplete
      - SLSKD_DOWNLOADS_DIR=/downloads
    volumes:
      - slskd_config:/app
      - soulcatcher_downloads:/downloads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phonolith
      POSTGRES_PASSWORD: phonolith
      POSTGRES_DB: phonolith
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to expose PostgreSQL to the host (e.g. for DB tools):
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonolith"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    # Uncomment to expose Redis to the host (e.g. for redis-cli debugging):
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  waveforms:
  caddy_data:
  caddy_config:
  polyphony_backups:
  tailscale_state:
  slskd_config:
  soulcatcher_downloads:
