services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://phonolith:phonolith@db:5432/phonolith
      - REDIS_URL=redis://redis:6379
      - ANALYST_URL=http://analyst:8000
      - DISCOGS_USER_TOKEN=${DISCOGS_USER_TOKEN:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - MUSICBRAINZ_APP_NAME=${MUSICBRAINZ_APP_NAME:-Phonolith}
      - MUSICBRAINZ_APP_VERSION=${MUSICBRAINZ_APP_VERSION:-1.0}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  analyst:
    build:
      context: ./analyst
      dockerfile: Dockerfile
    environment:
      - APP_URL=http://app:3000
      - REDIS_URL=redis://redis:6379
      - LIBRARY_PATH=/music
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
    volumes:
      - ${LIBRARY_PATH:-./music}:/music:ro
      - waveforms:/waveforms
    depends_on:
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phonolith
      POSTGRES_PASSWORD: phonolith
      POSTGRES_DB: phonolith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonolith"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  waveforms:
