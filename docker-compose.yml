services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - GENIUS_ACCESS_TOKEN=${GENIUS_ACCESS_TOKEN}
      - DATABASE_URL=postgresql://phonolith:phonolith@db:5432/phonolith
      - REDIS_URL=redis://redis:6379
      - ANALYST_URL=http://analyst:8000
      - LUCID_URL=http://lucid:8001
      - CREDENTIAL_KEY=${CREDENTIAL_KEY:-}
      - DISCOGS_USER_TOKEN=${DISCOGS_USER_TOKEN:-}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
      - MUSICBRAINZ_APP_NAME=${MUSICBRAINZ_APP_NAME:-Phonolith}
      - MUSICBRAINZ_APP_VERSION=${MUSICBRAINZ_APP_VERSION:-1.0}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  analyst:
    build:
      context: ./analyst
      dockerfile: Dockerfile
    ports:
      - "${ANALYST_PORT:-8000}:8000"
    environment:
      - APP_URL=http://app:3000
      - REDIS_URL=redis://redis:6379
      - LIBRARY_PATH=/music
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY:-}
    volumes:
      - ${LIBRARY_PATH:-./music}:/music:ro
      - waveforms:/waveforms
    depends_on:
      - redis
    restart: unless-stopped

  # Lucid — audio transport daemon (browser streaming + optional ALSA exclusive output)
  # Browser playback (the RAAT-style baseline) needs no audio hardware on the host.
  # ALSA exclusive output for enthusiast DACs requires the docker-compose.alsa.yml
  # overlay (adds /dev/snd passthrough) — see README.
  lucid:
    build:
      context: ./lucid
      dockerfile: Dockerfile
    ports:
      - "${LUCID_PORT:-8001}:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - APP_URL=http://app:3000
    volumes:
      - ${LIBRARY_PATH:-./music}:/music:ro
    depends_on:
      - redis
    restart: unless-stopped

  # NGINX — single public entry point. Routes media bytes and the realtime
  # transport WebSocket directly to Lucid (never through the Next.js app),
  # everything else to the Next.js app.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - lucid
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phonolith
      POSTGRES_PASSWORD: phonolith
      POSTGRES_DB: phonolith
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Uncomment to expose PostgreSQL to the host (e.g. for DB tools):
    # ports:
    #   - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonolith"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    # Uncomment to expose Redis to the host (e.g. for redis-cli debugging):
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  waveforms:
